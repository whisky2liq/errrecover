[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whisky2liq-errrecover"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别模型的错误恢复能力上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "whisky2liq" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://whisky2liq.github.io"
Repository = "https://github.com/whisky2liq/errrecover"
Issues = "https://github.com/whisky2liq/errrecover/issues"

[project.scripts]
errrecover = "errrecover:main"

[tool.setuptools]
py-modules = ["errrecover"]
